<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f6">
  <meta name="description" content="남북한의 말을 카드로 익히고 서로의 언어를 이해하는 학습 게임">
  <title>말로 잇는 우리 — 서로 다른 말, 하나로 이어지는 우리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="words.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="home" aria-label="말로 잇는 우리 홈">
        <span class="brand-mark">말</span>
        <span class="brand-name">말로 잇는 우리<span class="brand-dot">.</span></span>
      </a>
      <div class="side-label">학습 메뉴</div>
      <nav class="main-nav" aria-label="주 메뉴">
        <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span> 대시보드</button>
        <button class="nav-item" data-page="cards"><span class="nav-icon">▤</span> 단어 암기하기</button>
        <button class="nav-item" data-page="match"><span class="nav-icon">⤧</span> 단어 매칭 게임</button>
        <button class="nav-item" data-page="quiz"><span class="nav-icon">✳</span> 단어 퀴즈</button>
        <button class="nav-item" data-page="review"><span class="nav-icon">↻</span> 오답 복습 <span class="nav-count" id="wrong-count">0</span></button>
        <button class="nav-item" data-page="records"><span class="nav-icon">▥</span> 나의 학습 기록</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note">
          <span class="note-icon">✦</span>
          <p>한 단어를 알아갈수록<br>마음의 거리도 가까워져요.</p>
        </div>
        <button class="sound-toggle" id="sound-toggle" aria-pressed="true">
          <span class="sound-icon">♫</span><span>효과음</span><span class="toggle-pill"><i></i></span>
        </button>
        <div class="profile"><div class="avatar">말</div><div><strong>나의 학습</strong><small>오늘도 한 걸음</small></div><span class="profile-level" id="side-level">Lv. 1</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="메뉴 열기">☰</button>
        <div class="breadcrumb"><span>말로 잇는 우리</span><b>/</b><strong id="breadcrumb-current">대시보드</strong></div>
        <div class="top-actions"><span class="today-date" id="today-date"></span><button class="top-avatar" title="학습자">말</button></div>
      </header>
      <div class="content" id="content"></div>
      <footer class="footer">말로 잇는 우리 <span>·</span> 서로의 말을 이해하며 이어지는 우리</footer>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
</body>
</html>
